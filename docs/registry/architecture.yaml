# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-08-12"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: save_bundle (per-slot turn_records + snapshots + slot metadata)
    status: active
    owner_system: persistence
    adr: docs/architecture/adr-0002-persistence-storage-backend.md
    interface: "StorageBackend.stage(blobs: Array[Dictionary]) / commit() (2-phase; durability signaled via committed(world_time: int) on the underlying IndexedDB transaction's oncomplete). Other systems never write storage directly -- they implement get_blob() -> {status, bytes: String} and persistence gathers + writes on their behalf."
    write_access: persistence-only
    referenced_by:
      - docs/architecture/adr-0002-persistence-storage-backend.md
    added: 2026-08-11
    revised: ""

# Example:
#
# state_ownership:
#   - state: player_health
#     status: active           # active | superseded_by: ADR-NNNN
#     owner_system: health-system
#     adr: docs/architecture/adr-0001-health-system.md
#     interface: "HealthComponent.current_health (read-only float, range 0–max_health)"
#     write_access: health-system-only   # only owner can write; others read
#     referenced_by:
#       - docs/architecture/adr-0001-health-system.md
#       - docs/architecture/adr-0003-combat-system.md   # reads to apply damage
#       - docs/architecture/adr-0007-ui-system.md       # reads to display HUD
#     added: 2026-03-26
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: persistence_stage_commit
    status: active
    pattern: direct_call
    producer: persistence          # StorageBackend seam; emits committed()/failed()
    consumers:
      - turn-manager                # calls stage() then commit(), awaits the result to gate Turn Confirmed (Core Rule #1)
    adr: docs/architecture/adr-0002-persistence-storage-backend.md
    signal_signature: "stage(blobs: Array[Dictionary]) -> void [sync, no I/O] then commit() -> void [async]; result via committed(world_time: int) / failed(error_code: StringName) signals, never a return value"
    referenced_by:
      - docs/architecture/adr-0002-persistence-storage-backend.md
    added: 2026-08-11
    revised: ""

  - contract: ai_request_call
    status: active
    pattern: direct_call
    producer: ai-llm-integration-layer     # AiLlmRequestService, DI-injected Node (not Autoload)
    consumers:
      - turn-manager                        # calls request_ai() up to 3 times/turn (ai_call_budget_per_turn)
    adr: docs/architecture/adr-0003-ai-llm-integration-layer.md
    signal_signature: "request_ai(call_type: StringName, payload: Dictionary) -> Dictionary; returns {status: &\"success\"|&\"failed\", text/suggestions, error_code, error_reason} synchronously to the awaiting caller -- never raises for network/API failure"
    referenced_by:
      - docs/architecture/adr-0003-ai-llm-integration-layer.md
    added: 2026-08-12
    revised: ""

  - contract: undo_capturable_contract
    status: active
    pattern: direct_call
    producer: "each Feature system with a TR-*-Undo requirement (combat-system.md,
      exp-realm-progression.md, npc-affinity-relationship.md,
      death-and-consequence.md, character-card-identity.md) -- each implements
      @abstract class_name UndoCapturable extends RefCounted for its own
      Undo-covered state"
    consumers:
      - turn-manager                        # orchestrates capture (before Resolving) and
                                             # restore (on Undo or write-failure), holds
                                             # the single retained snapshot (undo_depth=1)
    adr: docs/architecture/adr-0004-turn-manager-undo.md
    signal_signature: "capture_snapshot() -> Dictionary [deep copy: .duplicate(true) for containers + .duplicate_deep() per Resource-typed field, Godot 4.5+]; restore_snapshot(snap: Dictionary) -> void [MUST mutate in-place, MUST re-emit the system's normal signals]"
    referenced_by:
      - docs/architecture/adr-0004-turn-manager-undo.md
    added: 2026-08-12
    revised: ""

  - contract: world_memory_read_interface
    status: active
    pattern: direct_call
    producer: world-memory
    consumers:
      - core-ui-screen-navigation   # D.3 Story Log pagination, D.3b S2 live window
    adr: docs/architecture/adr-0005-world-memory-ram-residency.md
    signal_signature: "get_turn_page(anchor_turn_id: int, count: int, direction: StringName) -> Dictionary; total_turns() -> int; get_turn(turn_id: int) -> Dictionary; get_processing_state(turn_id: int) -> Variant -- ALL await-shaped at every call site starting at MVP, even though the MVP implementation body is plain synchronous (no internal await/yield); callers must not call these directly from _process()/_physics_process()/_draw()/_input() (see forbidden_patterns)"
    referenced_by:
      - docs/architecture/adr-0005-world-memory-ram-residency.md
    added: 2026-08-12
    revised: ""

  - contract: tap_name_resolution
    status: active
    pattern: direct_call
    producer: character-card                # resolve_names_in_text(text) -> Array[Dictionary]
    consumers:
      - core-ui-screen-navigation            # build_tappable_bbcode() consumes match spans to
                                              # construct RichTextLabel.bbcode_text at render time
    adr: docs/architecture/adr-0006-tap-name-to-card-entry-point.md
    signal_signature: "resolve_names_in_text(text: String) -> Array[Dictionary] [{start: int, end: int, char_id: String}, ...], pure/stateless, matches true_value(name) AND disguise_value(name)/concealment.displayed_value(name) to the same char_id, only for card_exists(char_id)=true, longest-match-first non-overlapping"
    referenced_by:
      - docs/architecture/adr-0006-tap-name-to-card-entry-point.md
    added: 2026-08-12
    revised: ""

