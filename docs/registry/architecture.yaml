# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: static_function_hidden_state_for_testable_mechanics
    status: active
    description: "Gameplay mechanics functions requiring test verification (e.g. combat resolution, formula evaluation) must not be written as bare static/global functions relying on ambient/hidden state. Use pure functions (all needed state, including RNG, passed as explicit parameters) or instance methods with constructor-injected dependencies."
    why: "Static functions with hidden state cannot be spied/mocked cleanly by GUT (which wraps instances), and pseudocode written in this style repeatedly hid real bugs across 4 rounds of design review for Combat System (undefined symbols, missing parameters, unclear RNG provenance) that a compiler would have caught immediately had the code been written as executable pure functions from the start."
    adr: docs/architecture/adr-0001-combat-spec-authority.md
    added: 2026-08-07

  - pattern: bare_int_division_in_gameplay_formulas
    status: active
    description: "Never write `a / b` where both operands are statically `int`-typed in gameplay formula code. Always cast explicitly: `float(a) / b` (or an equivalent float-cast helper)."
    why: "GDScript's `int/int` truncates toward zero by default (opposite of Python's default true division) — an omitted float() cast silently produces wrong results rather than an error. This exact bug class caused Combat System's exhaustion-convergence formula to fail 0/108 Safe Range combinations under real GDScript semantics despite a prior numeric harness (written in Python, wrong default) claiming 72/72 convergence, and separately caused a tiebreak formula to degenerate into a disguised coin-flip 100% of the time in symmetric battles. See docs/architecture/adr-0001-combat-spec-authority.md Context for the full incident history."
    adr: docs/architecture/adr-0001-combat-spec-authority.md
    added: 2026-08-07

  - pattern: fileaccess_userdir_as_durability_gate
    status: active
    description: "Never use FileAccess/user:// (Emscripten IDBFS) completion, or JavaScriptBridge.force_fs_sync(), as the signal that a save write is durable. Never gate Turn Confirmed/Undo transitions (Core Rule #1) on either."
    why: "On Web export, FileAccess.store_*() returning true only means the write landed in the in-memory MEMFS layer; the actual IndexedDB sync happens on the next frame via an internal Emscripten callback that never reaches GDScript. force_fs_sync() only raises a dirty flag -- it reports completion to nobody. Treating either as durable makes Core Rule #1's write-ahead gate fiction. Confirmed by source-read spike (docs/engine-reference/godot/modules/web-export.md Q5/Q6) and is the deciding rejection reason for Alternative 1 (FileAccess/user:// over IDBFS) in adr-0002."
    adr: docs/architecture/adr-0002-persistence-storage-backend.md
    added: 2026-08-11

  - pattern: ai_llm_service_as_autoload
    status: active
    description: "AiLlmRequestService (owns the HTTPRequest node + Formula 1-3 retry/fallback state machine of ai-llm-integration-layer.md) must never be registered as a project Autoload. It must be constructed as a plain Node, owned and dependency-injected by its caller (Turn Manager)."
    why: "AC-29 of the already-Approved ai-llm-integration-layer.md GDD requires cooldown_until (the one variable that outlives a single logical call) to be injectable/isolable so GUT tests don't leak state between cases -- Autoloads are process-lifetime globals, exactly the pattern AC-29 exists to forbid. Also contradicts coding-standards.md's 'dependency injection over singletons' rule. Considered and rejected as Alternative 4 in adr-0003."
    adr: docs/architecture/adr-0003-ai-llm-integration-layer.md
    added: 2026-08-12

  - pattern: per_system_inverse_undo_operations
    status: active
    description: "A Feature system must never implement its own independent 'inverse
      operation' for Undo (e.g. a bespoke 'undo damage' that does HP += damage,
      separate from the forward damage-dealing code). Use the undo_capturable_contract
      (capture_snapshot()/restore_snapshot() via @abstract UndoCapturable) instead."
    why: "An inverse operation is a second, independently-writable piece of logic per
      mutation type that can silently drift from the forward operation as that forward
      logic evolves (e.g. a formula change with its inverse forgotten) -- the same class
      of risk the project's static_function_hidden_state_for_testable_mechanics and
      bare_int_division_in_gameplay_formulas forbidden patterns exist to prevent
      categorically. A generic capture/restore contract's correctness is independent of
      what the forward logic does, so it cannot drift the same way. Considered and
      rejected as Alternative 2 in adr-0004."
    adr: docs/architecture/adr-0004-turn-manager-undo.md
    added: 2026-08-12

  - pattern: await_shaped_call_from_non_awaitable_callback
    status: active
    description: "Never call World Memory's Public Interface (get_turn_page,
      total_turns, get_turn, get_processing_state -- world_memory_read_interface
      above), or any function that wraps one of them, directly from an engine
      callback that cannot itself await (_process(), _physics_process(), _draw(),
      _input(), etc.)."
    why: "Any GDScript function whose body contains `await` becomes a coroutine to
      its OWN caller, whether or not it ever actually suspends. At MVP this is
      harmless (the await-shaped Public Interface never really suspends yet), but
      calling it from a non-awaitable engine callback would silently break the
      moment Full Vision's implementation starts performing real async IndexedDB
      reads -- exactly the kind of bug that is free to prevent now and expensive to
      discover later. Identified by godot-specialist review during adr-0005
      drafting, 2026-08-12."
    adr: docs/architecture/adr-0005-world-memory-ram-residency.md
    added: 2026-08-12

  - pattern: ai_embedded_tap_target_markup
    status: active
    description: "Never prompt-instruct the AI to embed custom markup (e.g. {{char:id}}...{{/char}})
      around character names inside narration_text for the purpose of building interactive
      tap-targets. Use Character Card's resolve_names_in_text() (client-side, deterministic
      string matching against known name/alias records) instead -- see tap_name_resolution
      above."
    why: "A missed wrap silently removes a tap-target with no error signal (unlike a compiler-
      or test-catchable bug); a char_id marker containing digits sitting in the same string
      Contract Enforcement's Formula 1 scans risks false-positive leak detection depending on
      ordering; and it contradicts this project's established, repeatedly reaffirmed posture
      (ai-llm-integration-layer.md Core Rule #2, mechanic-narration-contract-enforcement.md's
      'no code path parses narration_text to extract world-state') of never trusting AI output
      for anything beyond narrative content itself. Considered and rejected as Alternative 1 in
      adr-0006."
    adr: docs/architecture/adr-0006-tap-name-to-card-entry-point.md
    added: 2026-08-12

  - pattern: unescaped_ai_text_in_bbcode_render
    status: active
    description: "Never inject narration_text (or any AI-generated free text) into a
      RichTextLabel's bbcode_text without first BBCode-escaping every segment outside an
      intentionally-constructed tag ([ -> [lb], ] -> [rb])."
    why: "AI-generated free text is not guaranteed bracket-free -- a literal '[' or ']' could
      corrupt BBCode parsing, or, if shaped by a successful prompt-injection attempt, forge a
      fake [url=]/[img=] tag pointing at attacker-chosen content. Structurally the same threat
      class already defended against for direct/stored prompt injection (AC-26/AC-33 of
      ai-llm-integration-layer.md), left open here for no reason if skipped. Considered and
      rejected as Alternative 5 in adr-0006."
    adr: docs/architecture/adr-0006-tap-name-to-card-entry-point.md
    added: 2026-08-12

  - pattern: wcag_aa_compliance_claim_with_open_gap
    status: active
    description: "Never state or imply 'WCAG 2.1 AA compliant' (store page, README, marketing,
      or any player-facing/public document) while adr-0006's Part 2 accessibility scope
      decision stands -- tap-name-to-card and the 3 marginalia bookmarks do not meet SC 4.1.2
      (Name/Role/Value) or SC 1.3.1 (Info/Relationships), both Level A, at MVP."
    why: "adr-0006 Part 2 accepts this gap on the record, with a documented keyboard-only
      fallback (AC-56a via the 「Thẻ」 bookmark) -- but that acceptance is conditioned on the
      gap never being silently misrepresented as full compliance. This is condition 3 of that
      ADR's four binding conditions; registering it here lets /architecture-review and future
      ADR/content authoring grep-check for the claim before it is ever made unknowingly."
    adr: docs/architecture/adr-0006-tap-name-to-card-entry-point.md
    added: 2026-08-12

  - pattern: single_channel_recursive_input_lock
    status: active
    description: "Never assign Control.mouse_behavior_recursive or
      Control.focus_behavior_recursive individually outside the project's single
      designated input-lock call site (_set_input_locked() or its final
      implementation name). Always set BOTH together, every time."
    why: "The two properties are fully independent (confirmed by direct ClassDB
      introspection + runtime test against the pinned Godot 4.6.stable binary,
      adr-0007) -- setting only one leaves the other input channel (mouse/touch OR
      keyboard/gamepad focus) completely unaffected by the lock. During Resolving/
      Undoing (Core UI D.1), this is a real double-submit risk: Tab+Enter could
      bypass a mouse-only lock entirely, or a tap could bypass a focus-only lock."
    adr: docs/architecture/adr-0007-core-ui-input-lock-screen-stack-safe-area.md
    added: 2026-08-12

  - pattern: screen_tier_scene_free_or_swap
    status: active
    description: "Never call queue_free(), SceneTree.change_scene_to_file(), or
      SceneTree.change_scene_to_packed() on any of Core UI's 5 screen-tier Control
      nodes (S1, S2, S4, S4-RO, S5) or the ScreenStack/OverlayStack/BannerStack
      Autoloads that own them. Toggle visible=true/false instead."
    why: "change_scene_to_file()/packed() frees the ENTIRE current scene tree --
      incompatible with overlays rendering above the screen below and preserved
      scroll position, both requirements of core-ui-screen-navigation.md's TR-cusn-016.
      This is distinct from content-tier eviction inside S2/S4 (D.3/D.3b), which DOES
      require true freeing (remove_paragraph()) -- the two lifecycles must not be
      confused with each other."
    adr: docs/architecture/adr-0007-core-ui-input-lock-screen-stack-safe-area.md
    added: 2026-08-12

  - pattern: javascript_bridge_eval_usage
    status: active
    description: "Never use JavaScriptBridge.eval() anywhere in the codebase. Every
      real project need (Web Locks, StorageManager.estimate(), IndexedDB
      transactions, safe-area CSS env() reads via getComputedStyle(), etc.) is
      reachable via get_interface()/create_object()/create_callback() instead."
    why: "eval() is the single API in JavaScriptBridge that forces a CSP
      unsafe-eval dependency (web-export.md Q9, source-verified) -- turning one
      environment risk (a host's CSP might block it) into a statically-checkable
      code-review rule instead. Already stated as project policy in
      technical-preferences.md (added 2026-08-08 after the web-export.md technical
      spike); registered here as a formal, grep-checkable entry after adr-0007
      found core-ui-screen-navigation.md's own TR-cusn-014 had drifted from this
      policy (its original text named eval() as the safe-area mechanism)."
    adr: docs/architecture/adr-0007-core-ui-input-lock-screen-stack-safe-area.md
    added: 2026-08-12

