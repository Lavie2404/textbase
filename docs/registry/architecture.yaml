# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: gameplay_rng
    status: active
    api: "RandomNumberGenerator instance, injected as the last parameter of every mechanics function that consumes randomness"
    not: "global/autoload RNG singleton; per-call ad-hoc RandomNumberGenerator.new()"
    adr: docs/architecture/adr-0001-combat-spec-authority.md
    reason: "Determinism for testing (GUT tests can mock a single injected stream) and dependency injection per coding-standards.md ('dependency injection over singletons'). Verified feasible by prototypes/combat-reference/harness.py experiment Q5 (same seed threaded through full call chain -> identical results across independent runs)."
    referenced_by:
      - docs/architecture/adr-0001-combat-spec-authority.md
    added: 2026-08-07
    revised: ""

  - purpose: web_save_persistence
    status: active
    api: "IndexedDB driven directly via JavaScriptBridge (get_interface/create_object/create_callback), transaction.oncomplete as the durability boundary"
    not: "FileAccess/user:// (Emscripten IDBFS) as the save path -- see forbidden_patterns below"
    adr: docs/architecture/adr-0002-persistence-storage-backend.md
    reason: "Core Rule #1 requires an observable durability event to gate Turn Confirmed transitions; IDBFS sync completion is not observable from GDScript (spike-verified). Empirically verified in prototypes/persistence-web/: Experiment #2 confirmed oncomplete reaches GDScript (24/24 iterations, correct put-before-complete ordering, 0.6-14.2ms p50 latency at 150ms budget); Experiment 2b confirmed the remaining mechanisms (PackedByteArray fails silently across the bridge -> String/base64 is the get_blob() contract; compound-key [slot_id, world_time] cursor scan via multi-fire callback; multi-store transaction commit+abort) all work as designed."
    referenced_by:
      - docs/architecture/adr-0002-persistence-storage-backend.md
    added: 2026-08-11
    revised: ""

  - purpose: cross_tab_slot_locking
    status: active
    api: "navigator.locks.request(name, {ifAvailable: true}, cb) via JavaScriptBridge; held across the session by passing Promise.resolve.bind(Promise, pendingPromise) as the lock callback (pending Promise constructed from GDScript via create_object('Promise', executor_cb), resolve stashed and invoked on release)"
    not: "returning the pending Promise directly from the create_callback() Callable -- Callable return values do not cross the bridge (verified: JS receives undefined, lock releases immediately)"
    adr: docs/architecture/adr-0002-persistence-storage-backend.md
    reason: "AC-18 requires instant multi-tab rejection ({ifAvailable:true}, no queue-wait); AC-33 requires crash-safe auto-release with zero heartbeat infrastructure. Verified empirically in prototypes/persistence-web/ Experiment #3 (bind_trick variant: held while pending, still held after 1s+, request promise settles + lock frees only after the stashed resolve() is invoked from GDScript)."
    referenced_by:
      - docs/architecture/adr-0002-persistence-storage-backend.md
    added: 2026-08-11
    revised: ""

  - purpose: ai_llm_backend
    status: active
    api: "Gemini API (generativelanguage.googleapis.com), called directly from the Godot client via HTTPRequest; model fallback ladder M = [\"gemini-3-flash-preview\", \"gemini-3.5-flash\", \"gemini-3.1-flash-lite\", \"gemini-2.5-flash\", \"gemini-2.5-flash-lite\"] (GEMINI_TEXT_MODEL_FALLBACKS order from src/reference.md), config-driven via AiLlmTuningConfig Resource -- never hardcoded"
    not: "backend proxy server for AI calls -- rejected, contradicts game-concept.md's client-side-key decision and adds infra cost/latency for no benefit at MVP scale"
    adr: docs/architecture/adr-0003-ai-llm-integration-layer.md
    reason: "Client-direct architecture verified feasible by prototypes/gemini-cors/ (CORS PASS, real browser fetch() reads cross-origin response). ai_context_hard_token_budget=8000 set as a fixed cost/latency-driven constant (not model-context-window-derived -- all 5 models verified ~1,048,576 input tokens, far too large to be a meaningful bound), closing QQ-01 from docs/architecture/architecture.md."
    referenced_by:
      - docs/architecture/adr-0003-ai-llm-integration-layer.md
    added: 2026-08-12
    revised: ""

  - purpose: undo_rollback_mechanism
    status: active
    api: "Optimistic-apply + single-slot snapshot-restore: every Feature system applies
      its locked_result to live state immediately (no staging/read-through anywhere);
      Turn Manager retains exactly 1 pre-turn snapshot at a time (undo_capturable_contract
      above), overwritten each new turn, matching undo_depth=1. The same restore call
      serves both Undo and 'Persistence write failed after Resolving/Undoing'."
    not: "deferred-commit staging (every Undo-covered read path across 5 systems would
      need to become staging-aware -- rejected as materially more invasive for an
      identical observable result); each system writing its own inverse operation
      (forward/inverse drift risk -- see forbidden_patterns below)"
    adr: docs/architecture/adr-0004-turn-manager-undo.md
    reason: "undo_depth=1 (registry-locked, turn-manager.md) makes a full staging/stack
      mechanism unnecessary weight -- exactly one retained snapshot suffices. Closes
      QQ-03/Character Card OQ#14 as a byproduct: Entity Record creation deltas piggyback
      the same per-turn stage()/commit() write already happening every confirmed turn
      per ADR-0002, giving card existence the same durability boundary as world_time."
    referenced_by:
      - docs/architecture/adr-0004-turn-manager-undo.md
    added: 2026-08-12
    revised: ""

  - purpose: world_memory_ram_residency
    status: active
    api: "World Memory's Full Narrative Log + extracted-fact store stay fully
      RAM-resident (GDScript Array/Dictionary) for the whole session at MVP scope;
      the public read interface (world_memory_read_interface above) is await-shaped
      at every call site starting now, but the MVP implementation body is plain
      synchronous -- no real suspension happens yet."
    not: "building real async IndexedDB-backed bounded-RAM reads at MVP (Full Vision
      concern, deferred -- see adr-0005 Alternative 1); a new warn_triggered-style
      RAM runtime monitor at MVP (Alternative 3, rejected as over-engineering for an
      unobserved risk)"
    adr: docs/architecture/adr-0005-world-memory-ram-residency.md
    reason: "Godot Web export's user:// (IDBFS/MEMFS) mirrors the entire file in RAM
      regardless -- FileAccess-based pagination never actually bounds RAM, so the
      only real RAM-bounded option is direct async IndexedDB queries (IndexedDB is
      inherently async). Numeric grounding (persistence-save-system.md's
      avg_turn_record_bytes=800, pessimistic 8x-16x GDScript String/Dictionary
      overhead) shows MVP-scope playthroughs (3 seed NPCs) stay far below any
      plausible mobile WASM heap ceiling. The await-shaped-now interface decision
      lets Full Vision's eventual real-async swap require zero Core UI call-site
      changes."
    referenced_by:
      - docs/architecture/adr-0005-world-memory-ram-residency.md
    added: 2026-08-12
    revised: ""

  - purpose: input_lock_recursive_disable
    status: active
    api: "BOTH Control.mouse_behavior_recursive AND Control.focus_behavior_recursive
      set together, always, via a single call site (_set_input_locked() or final
      implementation name) -- confirmed as two fully independent 3-state enum
      properties (Inherited/Disabled/Enabled) via direct ClassDB introspection +
      runtime test against the pinned Godot 4.6.stable binary, 2026-08-12. Verify
      the EFFECTIVE (post-override) state via get_mouse_filter_with_override() /
      get_focus_mode_with_override() -- a descendant's raw mouse_filter/focus_mode
      property does NOT change when an ancestor's recursive property is set."
    not: "setting only one of the two properties (leaves the other input channel --
      mouse/touch OR keyboard/gamepad -- completely unaffected by the lock, a real
      double-submit risk via Tab+Enter during Resolving/Undoing); relying on the
      older single mouse_filter property alone (does not cover focus at all)"
    adr: docs/architecture/adr-0007-core-ui-input-lock-screen-stack-safe-area.md
    reason: "This project's own curated docs/engine-reference/godot/modules/ui.md
      was found stale/wrong on this exact point during ADR drafting (documented only
      mouse_filter, never mentioned either *_behavior_recursive property existed) --
      corrected as part of this ADR. TR-cusn-015 (core-ui-screen-navigation.md) had
      self-flagged an internal contradiction between two of the project's own
      documentation sources and explicitly refused to arbitrate without direct
      engine verification."
    referenced_by:
      - docs/architecture/adr-0007-core-ui-input-lock-screen-stack-safe-area.md
    added: 2026-08-12
    revised: ""

  - purpose: screen_stack_architecture
    status: active
    api: "Three separate Autoload-owned CanvasLayer nodes, one per tier (ScreenStack
      layer=0, OverlayStack layer=1, BannerStack layer=2) -- CanvasLayer.layer
      provides draw-order independent of scene-tree position. Screen-tier nodes (S1,
      S2, S4, S4-RO, S5) and overlay-tier nodes (O-Card, O-Set) are instantiated once
      at boot and cached for the session, toggled via visible=true/false. Content
      nodes INSIDE S2/S4 (per-turn/per-page) are a separate, independent lifecycle
      (D.3/D.3b eviction) -- unrelated to this screen-tier caching."
    not: "SceneTree.change_scene_to_file()/change_scene_to_packed() for screen
      transitions (frees the entire current scene tree, incompatible with overlays
      rendering above the screen below + preserved scroll position); a single
      Autoload/CanvasLayer with z_index-based tier ordering instead of 3 separate
      CanvasLayers (reintroduces scene-tree-position-dependent ordering fragility)"
    adr: docs/architecture/adr-0007-core-ui-input-lock-screen-stack-safe-area.md
    reason: "core-ui-screen-navigation.md's TR-cusn-016 mandates both constraints
      (no change_scene_to_file/packed(); screen-tier cached not freed) but left the
      concrete scene/Autoload shape undecided. Godot's CanvasLayer.layer is the
      idiomatic mechanism for exactly this kind of role-based draw-order guarantee.
      Distinct from ai_llm_service_as_autoload's rejection of Autoload -- that
      rejection was scoped to AC-29's per-test-isolation requirement, which does not
      apply to screen-stack infrastructure (exactly one instance per running game,
      by design, per the GDD's own OQ#5a)."
    referenced_by:
      - docs/architecture/adr-0007-core-ui-input-lock-screen-stack-safe-area.md
    added: 2026-08-12
    revised: ""

  - purpose: safe_area_insets_web
    status: active
    api: "Custom HTML export shell (viewport-fit=cover meta tag) exposing
      env(safe-area-inset-*) as CSS custom properties (--sat/--sar/--sab/--sal) on
      :root, read via JavaScriptBridge.get_interface(\"window\") ->
      getComputedStyle(documentElement).getPropertyValue(...) -- a method-call
      chain, not a script-eval."
    not: "JavaScriptBridge.eval() to read env() values (TR-cusn-014's original text
      -- corrected by adr-0007; see javascript_bridge_eval_usage forbidden pattern
      below); relying on DisplayServer.get_display_safe_area() (native-only, returns
      nothing useful on Web export); trusting the stock Godot export template
      (lacks viewport-fit=cover, causes env() to silently resolve to 0px)"
    adr: docs/architecture/adr-0007-core-ui-input-lock-screen-stack-safe-area.md
    reason: "web-export.md Q9 already established JavaScriptBridge.eval() is the
      ONLY API in JavaScriptBridge requiring CSP unsafe-eval, and that every real
      project need (including this one) is reachable via get_interface()/
      create_object()/create_callback() instead -- getComputedStyle() is a plain
      method call returning a primitive string, the same class of mechanism already
      verified for navigator.locks/navigator.storage (Q6-Q8)."
    referenced_by:
      - docs/architecture/adr-0007-core-ui-input-lock-screen-stack-safe-area.md
    added: 2026-08-12
    revised: ""

