# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: world_time_advancement
    status: active
    source: design/gdd/turn-manager.md
    referenced_by:
      - design/gdd/turn-manager.md
      - design/gdd/persistence-save-system.md
    variables:
      - world_time
      - confirmed
      - undone
    output_range: [0, null]
    expression: "world_time' = world_time + confirmed(turn) * (1 - undone(turn))"
    notes: "world_time only advances on turns that are confirmed AND not
      undone. Read by World Memory & Context Management (NPC/world
      progression) and Persistence/Save System. Undo makes a turn 'never
      have happened' for this counter."
    added: 2026-08-02
    revised: ""

  - name: ai_call_budget_per_turn
    status: active
    source: design/gdd/turn-manager.md
    referenced_by:
      - design/gdd/turn-manager.md
      - design/gdd/mechanic-narration-contract-enforcement.md
      - design/gdd/world-memory-context-management.md
      - design/gdd/ai-llm-integration-layer.md
    variables:
      - suggestion_call
      - suggestion_retry_call
      - narration_call
    output_range: [0, 3]
    expression: "calls_per_turn = suggestion_call + suggestion_retry_call + narration_call"
    notes: "Hard invariant, not a tuning knob — a 4th AI call in the same
      turn is a bug. 3 (not 2) is the max: 1 suggestion-retry call is
      permitted when the AI returns <4/duplicate suggestions. Relevant to
      AI/LLM Integration Layer design.
      (Revised 2026-08-02 via /design-review: old expression was
      suggestion_call + narration_call, output_range [0,2] — the design
      review found this contradicted the GDD's own retry edge case.)"
    added: 2026-08-02
    revised: "2026-08-02"

  - name: numeric_leak_detection
    status: active
    source: design/gdd/mechanic-narration-contract-enforcement.md
    referenced_by:
      - design/gdd/mechanic-narration-contract-enforcement.md
    variables:
      - locked_result
      - narration_text
      - leak_count
      - leak_flag
    output_range: [0, null]
    expression: "leak_matches(turn) = { f in fields(locked_result) : is_numeric(f.value) AND f.value != 0 AND digits(f.value) in extract_numerals(narration_text) }; leak_count = |leak_matches(turn)|; leak_flag = 1 if leak_count > 0 else 0"
    notes: "QA/monitoring formula, not gameplay balance. Regex-based
      (digits only, not Vietnamese number-words) detection of raw numeric
      values leaking into AI narration text. Zero-valued fields excluded
      (avoids '0' token false positives). n=0 (no numeric fields in
      locked_result) must be logged distinctly from '0 leaks, system
      correct'. Only applies to narration_call, not suggestion_call. Feeds
      session_violation_count below."
    added: 2026-08-02
    revised: ""

  - name: session_violation_count
    status: active
    source: design/gdd/mechanic-narration-contract-enforcement.md
    referenced_by:
      - design/gdd/mechanic-narration-contract-enforcement.md
    variables:
      - V
      - T
      - violation_rate
    output_range: [0, 1]
    expression: "V = sum(leak_flag(turn)) for turn in session; T = count(narrated turns in session); violation_rate = V / T (T >= 1)"
    notes: "Direct operationalization of game-concept.md's MVP core
      hypothesis (zero-tolerance: AI must never alter a locked mechanical
      result). Gate condition is V=0 over T>=90 turns across >=3 sessions
      — an absolute count, NOT a rate threshold (any V>0 fails regardless
      of how low violation_rate is). T=0 -> violation_rate is 'N/A', never
      divide by zero. Turns that were later undone (Turn Manager Core Rule
      #9) are excluded from T, consistent with 'an undone turn never
      happened'."
    added: 2026-08-02
    revised: ""

  - name: thuc_pool_sufficiency
    status: active
    source: design/gdd/equipment-skill-data-system.md
    referenced_by:
      - design/gdd/equipment-skill-data-system.md
      - design/gdd/combat-system.md
    variables:
      - thuc_count
      - max_invocations_per_battle
    output_range: [0, 1]
    expression: "is_pool_sufficient(skill) = thuc_count(skill) >= max_invocations_per_battle"
    notes: "Data-integrity/authoring-time check, not gameplay balance math.
      max_invocations_per_battle is an EXTERNAL variable owned by Combat
      System (not yet designed) — this formula is provisional until that
      GDD defines it. When Combat System is designed, cross-check this
      value against actual thuc_count per skill in the data set."
    added: 2026-08-02
    revised: ""

  - name: undo_availability_window
    status: active
    source: design/gdd/turn-manager.md
    referenced_by:
      - design/gdd/turn-manager.md
      - design/gdd/world-memory-context-management.md
      - design/gdd/death-and-consequence.md
      - design/gdd/core-ui-screen-navigation.md
    variables:
      - turn_id
      - last_confirmed_turn_id
      - no_newer_turn_confirmed
      - has_confirmed_turn
      - is_death_turn
    output_range: [0, 1]
    expression: "undo_available = (turn_id == last_confirmed_turn_id) AND (no_newer_turn_confirmed) AND (has_confirmed_turn) AND (NOT is_death_turn)"
    notes: "Boolean, not continuous. At most one turn_id has
      undo_available=true at any time. Non-chainable: using undo requires a
      new confirmed action before it becomes available again. A turn whose
      result is a true death (Death & Consequence, deep-hostility threshold)
      is never undo-available, even as the most recent turn — this is the
      sole exception, see turn-manager.md Core Rules #9.
      (Revised 2026-08-02 via /design-review: added has_confirmed_turn to
      fix a sentinel-value edge case, and is_death_turn for the death
      exception — neither existed in the original formula.)"
    added: 2026-08-02
    revised: "2026-08-02"

  - name: recency_window_membership
    status: active
    source: design/gdd/world-memory-context-management.md
    referenced_by:
      - design/gdd/world-memory-context-management.md
    variables:
      - turn_id
      - last_confirmed_turn_id
      - recency_window_turns
    output_range: [0, 1]
    expression: "in_window(turn_id) = (last_confirmed_turn_id - turn_id) < recency_window_turns"
    notes: "Boolean. A turn falls out of the recency window (raw
      narration_text + locked_result) into extracted-facts-only form when
      a new turn is confirmed and (last_confirmed_turn_id - turn_id) >=
      recency_window_turns. Exactly one turn_id transitions per newly
      confirmed turn in steady state (see the batch-load edge case for
      resuming a save far ahead)."
    added: 2026-08-02
    revised: ""

  - name: fact_extraction_count
    status: active
    source: design/gdd/world-memory-context-management.md
    referenced_by:
      - design/gdd/world-memory-context-management.md
      - design/gdd/npc-affinity-relationship.md
      - design/gdd/setting-canon-integration.md
      - design/gdd/situation-encounter-generation.md
    variables:
      - locked_result fields
      - has_signal
      - facts_extracted
    output_range: [0, null]
    expression: "facts_extracted(turn) = count of locked_result fields where has_signal(f) is true; has_signal(f) = (numeric(f) AND f.value != 0) OR (boolean(f) AND f.value = true) OR (event(f) AND f.value != null)"
    notes: "One fact record per signaled field (not one fact per turn),
      each tagged with entity_id derived from the field's own naming
      convention (e.g. affinity_delta_[npc_id] -> entity_id=[npc_id];
      non-NPC-specific fields -> entity_id='global'). Extraction is
      100% rule-based on locked_result, never on narration_text (matches
      mechanic-narration-contract-enforcement.md Core Rule #3), and costs
      zero AI calls."
    added: 2026-08-02
    revised: ""

  - name: entity_fact_selection
    status: active
    source: design/gdd/world-memory-context-management.md
    referenced_by:
      - design/gdd/world-memory-context-management.md
      - design/gdd/setting-canon-integration.md
    # 2026-08-03: setting-canon-integration.md D.5 (canon_importance_tier)
    # cung cấp key thay thế (importance_tier DESC, world_time DESC) đúng
    # khe cắm "importance_score" mà notes bên dưới đã để ngỏ — cấu trúc
    # top_K không đổi, tương thích ngược khi mọi fact cùng tier.
    variables:
      - entity_id
      - facts
      - max_facts_per_entity
    output_range: [0, null]
    expression: "selected_facts(entity_id) = top_K(facts(entity_id), key=world_time, order=desc, K=max_facts_per_entity)"
    notes: "|selected_facts(entity_id)| <= max_facts_per_entity always
      holds regardless of how large the underlying fact store grows.
      Default ordering is recency (world_time desc), an intentional MVP
      choice — Setting & Canon Integration (not yet designed) may later
      swap key=world_time for key=importance_score without changing the
      formula's structure. An entity_id with zero facts returns an empty
      set, not an error."
    added: 2026-08-02
    revised: ""

  - name: ai_context_view_size_bound
    status: active
    source: design/gdd/world-memory-context-management.md
    referenced_by:
      - design/gdd/world-memory-context-management.md
      - design/gdd/persistence-save-system.md
    variables:
      - recency_window_turns
      - avg_turn_tokens
      - max_entities_per_prompt
      - max_facts_per_entity
      - avg_fact_tokens
    output_range: [0, null]
    expression: "context_size(prompt) <= recency_window_turns * avg_turn_tokens + max_entities_per_prompt * max_facts_per_entity * avg_fact_tokens = C (a constant independent of world_time)"
    notes: "The proof that resolves this system's HIGH-RISK flag: raw
      data (Full Narrative Log + all extracted facts) grows O(world_time)
      unbounded, but what actually goes into an AI prompt is O(1) bounded.
      Zero AI calls involved in computing this or the 3 formulas above —
      all rule-based, runs before any AI call in the turn, does not affect
      calls_per_turn (source: turn-manager.md, calls_per_turn_max=3) or
      ai_call_timeout_seconds=30 (no network I/O)."
    added: 2026-08-02
    revised: ""

  - name: combat_power_estimate
    status: active
    source: design/gdd/combat-system.md
    referenced_by:
      - design/gdd/combat-system.md
      - design/gdd/character-card-identity.md
    variables:
      - HP
      - ATK
      - DEF
      - SPD
      - ACC
      - Né tránh
      - CritRate
      - CritDamage
      - Amp (Khuếch đại sát thương)
      - Mitigation (Chống chịu)
      - Lifesteal
      - HPRegen
      - w_* (trọng số từng chỉ số, tuning knob)
      - Điểm_Kỹ_Năng(C) (external, chưa có hệ sở hữu công thức)
      - Điểm_Trang_Bị(C) (external, chưa có hệ sở hữu công thức)
    output_range: "(0,∞) bình thường; sentinel \"N/A\" khi cả 2 bên Lực_chiến=0, \"+∞\" khi chỉ đối thủ=0"
    expression: "Điểm_Chỉ_Số(C) = Σ w_X · X (12 chỉ số quy đổi cùng thang); Lực_chiến(C) = Điểm_Chỉ_Số(C) + Điểm_Kỹ_Năng(C) + Điểm_Trang_Bị(C); estimate_ratio(self,opponent) = Lực_chiến(self)/Lực_chiến(opponent), với sentinel \"N/A\" khi cả 2 = 0 và \"+∞\" khi chỉ opponent = 0"
    notes: "Công thức D.13 của combat-system.md — CHỈ dùng ước tính hiển thị
      trước trận (Character Card), KHÔNG BAO GIỜ quyết định thắng/thua thật
      (Combat Core Rule #7 — thắng/thua do HP về 0 qua nhiều pha giao đấu,
      không phải phép so sánh Lực chiến tổng). Điểm_Kỹ_Năng/Điểm_Trang_Bị là
      input mờ, mặc định 0 cho đến khi hệ sở hữu (chưa xác định — xem Open
      Questions của combat-system.md) định nghĩa công thức riêng. Trọng số
      w_* (đặc biệt w_HP=0.25) là placeholder tạm, cần đối chiếu khi EXP &
      Realm Progression định nghĩa đường cong tăng trưởng chỉ số thật."
    added: 2026-08-02
    revised: ""

  - name: tier_from_level
    status: active
    source: design/gdd/exp-realm-progression.md
    referenced_by:
      - design/gdd/exp-realm-progression.md
      - design/gdd/combat-system.md
      - design/gdd/character-card-identity.md
    variables:
      - level
    output_range: [1, null]
    expression: "tier(level) = floor((level - 1) / 10) + 1"
    notes: "10 cấp = 1 bậc/cảnh giới (game-concept.md Core Mechanics #3).
      Combat System Formula D.1 đọc tier(C) làm input trực tiếp (áp chế
      cảnh giới) — trước đây ghi 'nguồn: EXP & Realm Progression, chưa
      thiết kế', nay đã có công thức chính thức."
    added: 2026-08-03
    revised: ""

  - name: exp_threshold
    status: active
    source: design/gdd/exp-realm-progression.md
    referenced_by:
      - design/gdd/exp-realm-progression.md
      - design/gdd/character-card-identity.md
    variables:
      - level
      - BASE_EXP_THRESHOLD
      - EXP_THRESHOLD_INCREMENT
    output_range: [100, null]
    expression: "exp_threshold(level) = BASE_EXP_THRESHOLD + EXP_THRESHOLD_INCREMENT * (level - 1)"
    notes: "Đường cong EXP-lên-cấp, cố ý chọn TUYẾN TÍNH (không phải
      exponential/stepped) — quyết định thiết kế cho dự án solo/MVP nhỏ,
      ưu tiên người chơi tự nhẩm được tiến độ (Pillar 4). Dùng làm mẫu số
      chung cho combat_loss_exp, song_tu_exp_bonus, và nguồn EXP thụ động
      (đóng Open Question 'multi-source EXP cùng lượt' của game-concept.md).
      Đăng ký sớm vì Character Card & Identity và Persistence (cả 2 chưa
      thiết kế) nhiều khả năng cần hiển thị 'còn X EXP nữa' — dự đoán đã
      đúng: character-card-identity.md D.3 (exp_to_next) tiêu thụ trực
      tiếp từ 2026-08-04, kèm sentinel 'chờ đột phá' cho ca kẹp trần."
    added: 2026-08-03
    revised: ""

  - name: song_tu_active
    status: active
    source: design/gdd/npc-affinity-relationship.md
    referenced_by:
      - design/gdd/npc-affinity-relationship.md
      - design/gdd/exp-realm-progression.md
      - design/gdd/setting-canon-integration.md
      - design/gdd/situation-encounter-generation.md
    variables:
      - active_song_tu_set
      - SONG_TU_ACTIVE
    output_range: [0, 1]
    expression: "SONG_TU_ACTIVE = 1 if |active_song_tu_set| >= 1 else 0;
      interface trả DANH SÁCH NPC ID đang có quan hệ Song Tu active"
    notes: "Đóng Open Question của exp-realm-progression.md (boolean đơn
      hay NPC ID): interface là danh sách NPC ID, EXP tiêu thụ boolean
      derived 'khác rỗng'. EXP bonus KHÔNG cộng dồn theo số NPC (chặn
      dominant strategy harem — quyết định 2026-08-03). Đánh giá theo
      trạng thái ĐẦU LƯỢT: lượt Song Tu đầu tiên thiết lập quan hệ thì
      bonus bắt đầu từ lượt KẾ TIẾP. Quan hệ active bền: thiết lập bởi
      hành động Song Tu đầu tiên (đòi affinity >= song_tu_threshold),
      hủy khi affinity < song_tu_break_threshold, Ended khi NPC chết."
    added: 2026-08-03
    revised: ""

  - name: resolve_turn_affinity
    status: active
    source: design/gdd/npc-affinity-relationship.md
    referenced_by:
      - design/gdd/npc-affinity-relationship.md
      - design/gdd/world-memory-context-management.md
      - design/gdd/situation-encounter-generation.md
      - design/gdd/death-and-consequence.md
    variables:
      - classified_event
      - A_before
      - A_after
      - locked_delta
      - CAP_POSITIVE_PER_TURN
      - PROPAGATION_RATE
      - PROPAGATION_SEVERITY_MIN
      - CRUELTY_REP_DELTA
      - link_strength
      - perpetrator_known
    output_range: "mỗi field affinity_delta_[npc_id] là SỐ NGUYÊN, bó bởi
      clamp per-NPC — A_after luôn trong [-100, 100]"
    expression: "Pipeline D.6: base_delta (D.1) -> diminish (D.2, chỉ
      dương) -> fatigue (D.3, cửa sổ trượt 3 lượt, chỉ dương) ->
      propagation one-hop (D.5, cần severity >= min AND perpetrator_known)
      -> cộng dồn per-NPC -> cap phần dương (D.4) ->
      round-half-away-from-zero 1 lần -> clamp [-100,100] -> locked_delta
      = A_after - A_before; locked_delta = 0 thì KHÔNG ghi field"
    notes: "Sở hữu schema field affinity_delta_[npc_id] (khớp quy ước
      entity_id của World Memory — fact_extraction_count trích 1 fact/
      field có tín hiệu). Song Tu action (+random int 1-10 uniform) MIỄN
      TRỪ D.2-D.4. Delta âm không diminish/không cap (không có sàn an
      toàn). KHÔNG lan truyền bậc 2 — không có rủi ro clamp dây chuyền
      (đóng cờ HIGH-RISK của systems-index cho hệ này). Giết không nhân
      chứng: 0 field (tội ác hoàn hảo hợp lệ, quyết định 2026-08-03)."
    added: 2026-08-03
    revised: ""

  - name: breakthrough_requirement_met
    status: active
    source: design/gdd/setting-canon-integration.md
    referenced_by:
      - design/gdd/setting-canon-integration.md
      - design/gdd/exp-realm-progression.md
    variables:
      - tier
      - setting_pack.breakthrough_requirement
      - world_state
    output_range: [0, 1]
    expression: "breakthrough_requirement_met(tier) =
      premise_satisfied(setting_pack.breakthrough_requirement[tier],
      world_state); nếu setting KHÔNG định nghĩa requirement cho tier đó
      -> false CỨNG + log warning 'content gap'"
    notes: "Đóng interface provisional mà exp-realm-progression.md Core
      Rule #6 chờ (dependency HARD của hệ đó). Predicate là DATA thuần
      theo setting pack (VD Đấu La: hấp thụ Hồn Hoàn phù hợp tier) —
      code không hard-code logic setting-specific. Thứ tự trong lượt:
      resolve_turn_canon STEP 3 tính giá trị này TRƯỚC resolve_turn_exp
      (khớp Edge Case 'đột phá trước, EXP sau' của exp GDD). 2 code path
      false phân biệt được: thiếu data (warning) vs chưa đủ điều kiện."
    added: 2026-08-03
    revised: ""

  - name: resolve_turn_canon
    status: active
    source: design/gdd/setting-canon-integration.md
    referenced_by:
      - design/gdd/setting-canon-integration.md
      - design/gdd/world-memory-context-management.md
      - design/gdd/situation-encounter-generation.md
    variables:
      - classified_event
      - premise_satisfied
      - event_due
      - substitute_selection
      - cascade_vanish_check
      - CASCADE_MAX_DEPTH
    output_range: "field int/bool/enum; số field/lượt <= (event active ×
      premise + số nhân vật Chờ Đột Phá)"
    expression: "Pipeline 5 bước: (1) eager check premise không-đảo-được
      tới fixpoint (on_break=vanish -> Suspended, người chơi cứu được);
      (1b) canon_role_rescue từ hành động tự do — phán quyết cơ học qua
      eligible D.3; (2) phán quyết event Due theo (earliest_world_time,
      event_id), tie-break chính sách vanish > branch > substitute; (3)
      breakthrough_requirement_met; (4) khóa field canon_break_flag_[event_id]
      (entity 'global'), canon_event_[event_id]_status ('global'),
      canon_role_filled_[npc_id] ([npc_id]); (5) TM Core Rule #8"
    notes: "Sở hữu 3 field-pattern canon_* (khớp quy ước entity_id của WM
      — fact_extraction_count trích 1 fact/field). Mọi phán quyết
      deterministic, 0 AI call. Thứ tự trong lượt: SAU Combat/Death &
      Consequence/NPC Affinity, TRƯỚC resolve_turn_exp. State Suspended:
      premise lõi bị phá vĩnh viễn -> treo chờ người chơi cứu (quyết
      định 2026-08-03, 'ưu tiên trải nghiệm người chơi'); đến hạn vai
      lõi còn trống -> Vanished + cascade chạy TẠI ĐÓ (không eager)."
    added: 2026-08-03
    revised: ""

  - name: canon_importance_tier
    status: active
    source: design/gdd/setting-canon-integration.md
    referenced_by:
      - design/gdd/setting-canon-integration.md
      - design/gdd/world-memory-context-management.md
    variables:
      - fact.field_name
      - fact.field_value
      - AFFINITY_MAGNITUDE_TIER2
    output_range: [0, 3]
    expression: "importance_tier(fact) = 3 nếu canon_event_*_status
      terminal / canon_break_flag_*=true / death_flag_*=true; 2 nếu
      breakthrough_flag_*=true hoặc |affinity_delta_*| >=
      AFFINITY_MAGNITUDE_TIER2; 1 nếu battle_result_*; 0 còn lại. Key
      chọn fact WM = (importance_tier DESC, world_time DESC)"
    notes: "Pure function O(1) trên field_name/field_value — không đọc
      world-state ngoài (giữ trích xuất WM rule-based thuần). Thay key
      của entity_fact_selection đúng khe cắm WM Formula #3 để ngỏ; tương
      thích ngược: mọi fact cùng tier -> suy biến thành recency thuần.
      'Vượt ngưỡng affinity' dùng BIÊN ĐỘ delta làm proxy (fact không
      chứa A_before/A_after) — compromise có chủ đích. 3 tên field
      provisional (death_flag, breakthrough_flag, battle_result) chờ
      Death & Consequence/EXP/Combat chốt schema."
    added: 2026-08-03
    revised: ""

  - name: stat_growth
    status: active
    source: design/gdd/exp-realm-progression.md
    referenced_by:
      - design/gdd/exp-realm-progression.md
      - design/gdd/combat-system.md
      - design/gdd/character-card-identity.md
      - design/gdd/death-and-consequence.md
      - design/gdd/npc-affinity-relationship.md
    variables:
      - base_X0
      - level
      - tier
      - LEVEL_GROWTH_X
      - BREAKTHROUGH_BONUS_X
      - PERCENT_STAT_CAP
    output_range: "[base_X0, ∞) cho chỉ số thô; [0, PERCENT_STAT_CAP] cho chỉ số dạng %"
    expression: "stat_value(C, X) = base_X0 + LEVEL_GROWTH_X * (level(C) - 1) + BREAKTHROUGH_BONUS_X * (tier(C) - 1); chỉ số % thêm clamp(., 0, PERCENT_STAT_CAP)"
    # 2026-08-10 (character-card-identity.md /design-review round 1):
    # stat_value(C, HP) là giá trị mà death-and-consequence.md và
    # npc-affinity-relationship.md gọi là max_HP (dùng làm mẫu số
    # margin_ratio) — 2 tên, cùng 1 giá trị, đọc trực tiếp true_value(C,HP)
    # qua character-card-identity.md D.5, KHÔNG qua concealment. base_HP0
    # (input của stat_value khi X=HP) nay ràng buộc strict >0 (khác 11 chỉ
    # số còn lại, ≥0) ở character-card-identity.md D.5, đảm bảo max_HP
    # không bao giờ =0 xuống 2 hệ downstream trên. +2 referenced_by.
    notes: "Tăng đều mỗi cấp + nhảy vọt riêng mỗi lần đột phá (tier tăng).
      Là nguồn THẬT cho base_ATK/base_HP/... mà Combat System Formula D.1
      dùng làm input trước khi áp áp chế cảnh giới (combat-system.md hiện
      chỉ ví dụ 'base_ATK=50' không trích nguồn). Trực tiếp đóng placeholder
      w_HP=0.25 của combat_power_estimate (D.13) — combat-system.md cần
      đối chiếu lại trọng số w_* với scale thật này (xem Open Questions của
      exp-realm-progression.md). GDD này chỉ hand-tune ví dụ cho HP/ATK/
      Crit Rate; 9 chỉ số còn lại cần 1 pass cân bằng riêng (Open Questions)."
    added: 2026-08-03
    revised: ""

  - name: hostile_initiative_allowed
    status: active
    source: design/gdd/situation-encounter-generation.md
    referenced_by:
      - design/gdd/situation-encounter-generation.md
      - design/gdd/exp-realm-progression.md
    variables:
      - level(npc)
      - level(player)
      - HOSTILE_INITIATIVE_LEVEL_GAP_MAX
      - provoked_flag
    output_range: [0, 1]
    expression: "hostile_initiative_allowed(npc) = (level(npc) − level(player)
      ≤ HOSTILE_INITIATIVE_LEVEL_GAP_MAX) OR provoked_flag(npc)"
    notes: "Đóng vai 'hệ khác sở hữu ngưỡng 20 cấp' mà
      exp-realm-progression.md Rule #10/AC-17 chờ (EXP chỉ cung cấp level
      thô). MỘT CHIỀU, không phải trị tuyệt đối — NPC yếu hơn tấn công
      lên hợp pháp. Thù địch sâu sắc (affinity ≤ -80) KHÔNG bypass gap;
      chỉ provoked_flag (D.3, severity ≥ PROVOKE_SEVERITY_MIN=3, không
      decay — tiêu thụ hoặc hòa giải affinity ≥ -10) mới bypass.
      provoked mở QUYỀN, không mở ĐỘNG CƠ — D.4 vẫn đòi affinity ≤ -40
      mới thành hostile candidate."
    added: 2026-08-03
    revised: ""

  - name: encounter_level_range
    status: active
    source: design/gdd/situation-encounter-generation.md
    referenced_by:
      - design/gdd/situation-encounter-generation.md
      - design/gdd/combat-system.md
    variables:
      - player_level
      - AMBIENT_LEVEL_BAND_DOWN
      - AMBIENT_HOSTILE_LEVEL_CAP
    output_range: "[max(1, player_level − 15), player_level + 15] mặc định;
      biên trên không bao giờ vượt player_level + 20"
    expression: "encounter_level_range(player_level) = [max(1, player_level −
      AMBIENT_LEVEL_BAND_DOWN), player_level + AMBIENT_HOSTILE_LEVEL_CAP];
      AMBIENT_HOSTILE_LEVEL_CAP trần cứng ≤ 20"
    notes: "CHỈ cho đối thủ ambient vô danh sinh thủ tục — NPC/canon có
      char_id dùng level data cố định. Trần cứng 20 là hệ quả logic bắt
      buộc từ hostile_initiative_allowed (đối thủ vừa sinh không thể có
      provoked_flag). Combat (provisional) dùng level sinh ra + stat_growth
      (EXP) để dựng chỉ số đối thủ — xem Open Questions của GDD nguồn."
    added: 2026-08-03
    revised: ""

  - name: entities_in_scope
    status: active
    source: design/gdd/situation-encounter-generation.md
    referenced_by:
      - design/gdd/situation-encounter-generation.md
      - design/gdd/world-memory-context-management.md
      - design/gdd/npc-affinity-relationship.md
      - design/gdd/death-and-consequence.md
    variables:
      - hook_participants
      - canon_role_npcs
      - other_present_npcs
      - MAX_NPC_PER_SCENE
    output_range: "1 ≤ |entities_in_scope| ≤ MAX_NPC_PER_SCENE + 1 = 4"
    expression: "entities_in_scope(scene) = {\"global\"} ∪
      top_K(candidates(scene), key=(tier, -|affinity|, npc_id),
      K=MAX_NPC_PER_SCENE); tier: hook_participants=0 < canon_role_npcs=1
      < còn lại=2"
    notes: "Đóng trách nhiệm 'NPC nào có mặt trong cảnh' mà
      world-memory-context-management.md đã khai chờ (Formula #4 bên đó
      tiêu thụ biến này). Cũng là danh sách nhân chứng cho lan truyền
      Hảo cảm (npc-affinity D.5) và kill_witnessed. Luôn ≤
      max_entities_per_prompt=4 theo cấu trúc."
    added: 2026-08-03
    revised: ""

  - name: allowed_envelope_menu
    status: active
    source: design/gdd/situation-encounter-generation.md
    referenced_by:
      - design/gdd/situation-encounter-generation.md
      - design/gdd/ai-llm-integration-layer.md
      - design/gdd/npc-affinity-relationship.md
    variables:
      - ENVELOPE_TYPES
      - scene
      - POSITIVE_SOCIAL_COOLDOWN_TURNS
      - last_used
    output_range: "tập con ENVELOPE_TYPES × ({npc_id} ∪ {null}); luôn chứa
      rp_only, investigate"
    expression: "allowed_envelope_menu(turn) = { t ∈ ENVELOPE_TYPES :
      gate(t, turn, npc?) }; ENVELOPE_TYPES = {gift, small_help, save_life,
      insult, threaten, betray, combat_challenge(spar_friendly),
      song_tu_action, canon_role_rescue, move_to, investigate, rp_only}"
    notes: "SỞ HỮU taxonomy sự kiện xã hội chuẩn hóa mà
      npc-affinity-relationship.md chờ (đóng Open Question 'taxonomy
      chính thức' + cờ spar_friendly). Whitelist deterministic gửi vào
      suggestion_call — nhãn AI trả ngoài menu hạ cứng rp_only; văn tự do
      phân loại DUY NHẤT qua intent chip người chơi khai. Gating chống
      ratchet (economy-designer 2026-08-03): gift/small_help cooldown per
      (loại, NPC) + cấm cảnh dangerous; save_life hook-gated hoàn toàn;
      song_tu cần private + willing. CẦN sửa schema suggestion_call của
      ai-llm-integration-layer.md: array[4] string → array[4]
      {text, envelope} (Open Question, chưa sửa)."
    added: 2026-08-03
    revised: ""

  - name: alive
    status: active
    source: design/gdd/death-and-consequence.md
    referenced_by:
      - design/gdd/death-and-consequence.md
      - design/gdd/setting-canon-integration.md
      - design/gdd/character-card-identity.md
    variables:
      - char_id
      - alive_flag
      - death_flag_[char_id]
    output_range: "[0, 1] — boolean per-nhân vật (chính hoặc NPC)"
    expression: "alive(char_id) = true mặc định (lazy-init, chưa từng ghi
      thì đọc = true); chuyển false VĨNH VIỄN chỉ qua 2 code path: Nhánh
      A bước c (nhân vật chính chết thật, death_roll=death) hoặc Nhánh B
      Kết liễu (NPC bị người chơi giết). Cùng lúc khóa field
      death_flag_[char_id]=true (entity_id=char_id, khớp quy ước World
      Memory)."
    notes: "Đóng interface provisional mà setting-canon-integration.md
      D.3 (predicate alive(X)) chờ — nguồn premise-break eager quan
      trọng nhất của hệ đó. KHÔNG đảo được (chết là chết thật, Anti-
      Pillar) — false thì false mãi, khớp bảng predicate D.3 của Setting
      & Canon. death_flag_[char_id] cũng đóng field name provisional mà
      world-memory-context-management.md's canon_importance_tier
      (registry) đã dùng tạm."
    added: 2026-08-03
    revised: ""

  - name: death_and_consequence_blocked
    status: active
    source: design/gdd/death-and-consequence.md
    referenced_by:
      - design/gdd/death-and-consequence.md
      - design/gdd/exp-realm-progression.md
      - design/gdd/character-card-identity.md
    variables:
      - character
      - severity_tier
      - forced_severe
    output_range: [0, 1]
    expression: "death_and_consequence_blocked(character) = true khi
      severity_tier(character)=\"severe\" (phế đan điền/võ công, Formula
      D.2 của GDD nguồn) vừa khóa; false mặc định; gỡ CHỈ qua Formula
      D.3 (recovery_attempt) thành công — không tự hết hạn theo thời
      gian."
    notes: "Đóng interface provisional mà exp-realm-progression.md Core
      Rule #9 đã dùng TÊN CHÍNH XÁC này để chặn tích lũy EXP (cả 4
      nguồn) — không đổi tên khi hệ nguồn được thiết kế, tránh sửa chéo
      file không cần thiết. Idempotent: thua tiếp khi đang true không
      đổi gì thêm (death-and-consequence.md Edge Case #2)."
    added: 2026-08-03
    revised: ""

  - name: card_exists
    status: active
    source: design/gdd/character-card-identity.md
    referenced_by:
      - design/gdd/character-card-identity.md
      - design/gdd/core-ui-screen-navigation.md
    variables:
      - char_id
      - entities_appearing(t)
      - confirmed(t)
      - undone(t)
    output_range: [0, 1]
    expression: "card_exists(char_id) = OR over all turns t of [
      (char_id in entities_appearing(t)) AND confirmed(t)=1 AND
      undone(t)=0 ]"
    notes: "Formula D.1 của character-card-identity.md — thẻ nhân vật tồn
      tại khi nhân vật xuất hiện trong >=1 lượt confirm-và-không-undo (có
      entity record World Memory). Undo đúng lượt tạo thẻ hủy tạo thẻ
      (an toàn vì undo_depth=1). Giữ true vĩnh viễn kể cả khi nhân vật
      chết (thẻ mang triện alive=false). Đăng ký vì Core UI/Screen
      Navigation (hệ #15, đã Designed 2026-08-04) cần để render điểm vào
      tap-tên trong văn tường thuật (tên nào mở được thẻ) — Core Rule #8
      + AC-29 bên đó."
    added: 2026-08-04
    revised: "2026-08-04"

  - name: reset_completeness_check
    status: active
    source: design/gdd/character-continuation.md
    referenced_by:
      - design/gdd/character-continuation.md
    variables:
      - N
      - s
      - ok(s)
      - completeness_ratio
      - reset_complete
      - handoff_allowed
    output_range: [0, 1]
    expression: "completeness_ratio(reset) = (1/N) × Σ(s=1→N) ok(s);
      reset_complete = 1 nếu completeness_ratio = 1 else 0;
      handoff_allowed = reset_complete AND (N≥1)"
    notes: "Invariant boolean tất-cả-hoặc-không-gì, không phải công
      thức cân bằng gameplay — gate bắt buộc trước khi chuyển
      `Processing Chơi Lại → New Playthrough Started`. N=5 hiện tại
      (EXP & Realm Progression, NPC Affinity, Setting & Canon
      Integration, Death & Consequence [alive/death_and_consequence_blocked],
      Equipment & Skill Data System) — danh sách mở, tăng khi hệ mới
      tham gia ràng buộc reset. handoff_allowed=0 → state Reset Failed
      (chặn + báo lỗi, không retry ngầm)."
    added: 2026-08-03
    revised: ""

  - name: continuation_choice_eligible
    status: active
    source: design/gdd/character-continuation.md
    referenced_by:
      - design/gdd/character-continuation.md
      - design/gdd/core-ui-screen-navigation.md
    variables:
      - turn
      - is_death_turn(turn)
      - death_confirmed(turn)
    output_range: [0, 1]
    expression: "continuation_choice_eligible(turn) = is_death_turn(turn) AND death_confirmed(turn)"
    notes: "Invariant phòng thủ 2 lớp giữa Turn Manager
      (is_death_turn, registry undo_availability_window) và Death &
      Consequence (death_confirmed) — 2 flag luôn khóa cùng lúc theo
      thiết kế nguồn, công thức tồn tại để bắt lỗi đồng bộ nếu có bug.
      Điều kiện DUY NHẤT chuyển Idle → Awaiting Continuation Choice."
    added: 2026-08-03
    revised: ""

